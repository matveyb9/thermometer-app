workflows:
  android-debug-all:
    name: Both Flavors Debug
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Make gradlew executable
        script: chmod +x gradlew
      - name: Build Auto Debug
        script: ./gradlew assembleAutoDebug
      - name: Build Manual Debug
        script: ./gradlew assembleManualDebug
    artifacts:
      - app/build/outputs/apk/auto/debug/*.apk
      - app/build/outputs/apk/manual/debug/*.apk
